[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clostridium-difficile-recurrence-engine"
version = "2.1.0"
description = "Deterministic adult CDI severity classification, recurrence-risk heuristics, and guideline-referenced treatment option summaries."
readme = "README.md"
authors = [{ name = "Abu Suraih Sakhri" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "build>=1.2,<2",
]

[project.scripts]
clostridium-difficile-recurrence-engine = "clostridium_difficile_recurrence_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/clostridium-difficile-recurrence-agent"
Repository = "https://github.com/abusuraihsakhri/clostridium-difficile-recurrence-agent.git"

[tool.setuptools]
py-modules = ["cdiff_recurrence", "cli"]

[tool.setuptools.packages.find]
include = ["clostridium_difficile_recurrence_agent*"]
