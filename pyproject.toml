[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clostridium-difficile-recurrence-engine"
version = "2.0.0"
description = "CDiff-Sentinel: SHEA/IDSA Staging, Fidaxomicin Triage & FMT Candidate Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
clostridium-difficile-recurrence-engine = "clostridium_difficile_recurrence_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/clostridium-difficile-recurrence-engine"
Repository = "https://github.com/abusuraihsakhri/clostridium-difficile-recurrence-engine.git"
