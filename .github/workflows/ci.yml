name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "build>=1.2,<2"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run test suite
        run: python -m pytest -p no:zarr -v

      - name: Build package
        run: python -m build

      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          clostridium-difficile-recurrence-engine --help

      - name: Run CLI batch smoke test
        run: |
          python cli.py batch -i sample.csv -o out_smoke.csv
          test -s out_smoke.csv
          rm out_smoke.csv

      - name: Run browser-engine smoke tests
        run: node tests/web_engine.test.mjs
